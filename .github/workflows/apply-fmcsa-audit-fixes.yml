name: Apply FMCSA audit fixes

on:
  push:
    branches: [fix/fleet-exposure-20260908]
    paths:
      - '.github/workflows/apply-fmcsa-audit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reconciled source and methodology corrections
        run: python scripts/apply_fmcsa_audit_v2.py
      - name: Apply documented legacy docket lineage
        run: python scripts/apply_legacy_docket_lineage_fix.py
      - name: Apply live-verified prefix docket alias
        run: python scripts/apply_prefix_docket_alias_fix.py
      - name: Refresh all official FMCSA schemas and health
        run: python scripts/refresh_fmcsa.py --workers 6
      - name: Validate 36-source registry alignment
        run: python scripts/validate_source_contract.py
      - name: Validate every live join and normalization
        run: python scripts/validate_fmcsa_data_contract.py
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Smoke all Carrier 360 source joins
        run: python scripts/smoke_carrier_queries.py
      - name: Validate SMS v3.21 replay
        run: python scripts/validate_sms_v321_replay.py
      - name: Remove one-time audit machinery
        run: |
          rm -f \
            scripts/apply_fmcsa_audit_fixes.py \
            scripts/apply_fmcsa_audit_v2.py \
            scripts/apply_legacy_docket_lineage_fix.py \
            scripts/apply_prefix_docket_alias_fix.py \
            scripts/fix_data_contract_gate.py \
            scripts/probe_legacy_archive_joins.py \
            .github/workflows/apply-fmcsa-audit-fixes.yml \
            .github/workflows/fix-data-contract-gate.yml \
            .github/workflows/probe-fmcsa-branch.yml \
            .github/workflows/probe-legacy-archives.yml
      - name: Commit only after complete audit gate
        run: |
          git config user.name 'transport3r-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete FMCSA source and methodology audit'
          git push origin HEAD:fix/fleet-exposure-20260908
