name: Reproducible application review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR revisions must not keep acquiring the same live sources.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned audit dependencies
        run: |
          python -m pip install -r scripts/requirements-nationwide.txt playwright==1.57.0
          mkdir -p /tmp/transport3r-review/wheels
          python -m pip download --no-deps --only-binary=:all: -r scripts/requirements-nationwide.txt --dest /tmp/transport3r-review/wheels
      - name: Test fail-closed warehouse audit
        run: python -m unittest discover -s scripts -p 'test_audit_warehouse_integrity.py' -v
      - name: Build and validate application
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Verify release metadata delay and failure recovery (local test responses only)
        run: python scripts/validate_release_browser.py /tmp/transport3r-review/release-browser
      - name: Verify raw-to-audit-to-API-to-browser integration (synthetic data only)
        run: python scripts/validate_integrity_browser.py /tmp/transport3r-review/browser
      - name: Verify authenticated local coverage review (synthetic data only)
        run: python scripts/validate_private_browser.py /tmp/transport3r-review/private-browser
      - name: Verify filtered open maps and responsive carrier table (synthetic data only)
        run: python scripts/validate_open_maps_browser.py /tmp/transport3r-review/open-maps-browser
      - name: Verify same-snapshot reports and VIN-specific findings (synthetic data only)
        run: python scripts/validate_snapshot_vin_browser.py /tmp/transport3r-review/snapshot-vin-browser
      - name: Retain reproducible public-code review package
        if: always()
        run: |
          mkdir -p /tmp/transport3r-review
          git archive --format=tar HEAD -o /tmp/transport3r-review/source.tar
          if [ -d node_modules ]; then tar -czf /tmp/transport3r-review/node-modules.tar.gz node_modules; fi
          if [ -d dist ]; then cp -R dist /tmp/transport3r-review/dist; fi
          git rev-parse HEAD > /tmp/transport3r-review/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-review-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: /tmp/transport3r-review/
          retention-days: 7
          if-no-files-found: error

  current-release-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install playwright==1.57.0
      - name: Identify current protected main for this diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api repos/${{ github.repository }}/branches/main --jq '.commit.sha')"
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
      - name: Verify existing hosted release and capture desktop/mobile routes
        env:
          PAGE_URL: https://jeremyhennessy.github.io/Transport3r/
        run: |
          node scripts/verify-hosted.mjs
          python scripts/verify_live_ui.py --output /tmp/current-release-ui --routes overview carriers atlas atlas-carrier summary safety authority evidence portfolio alerts methodology fleet insurance sms intelligence sources inspection vin integrity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-release-ui-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: /tmp/current-release-ui/
          if-no-files-found: warn
          retention-days: 7
