name: Reproducible application review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned audit dependencies
        run: |
          python -m pip install -r scripts/requirements-nationwide.txt
          mkdir -p /tmp/transport3r-review/wheels
          python -m pip download --no-deps --only-binary=:all: -r scripts/requirements-nationwide.txt --dest /tmp/transport3r-review/wheels
      - name: Test fail-closed warehouse audit
        run: python -m unittest discover -s scripts -p 'test_audit_warehouse_integrity.py' -v
      - name: Build and validate application
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
      - name: Retain reproducible public-code review package
        if: always()
        run: |
          mkdir -p /tmp/transport3r-review
          git archive --format=tar HEAD -o /tmp/transport3r-review/source.tar
          if [ -d node_modules ]; then tar -czf /tmp/transport3r-review/node-modules.tar.gz node_modules; fi
          if [ -d dist ]; then cp -R dist /tmp/transport3r-review/dist; fi
          git rev-parse HEAD > /tmp/transport3r-review/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-review-${{ github.sha }}
          path: /tmp/transport3r-review/
          retention-days: 7
          if-no-files-found: error
