name: Fast code and private-workspace validation

on:
  push:
    branches:
      - feature/insurance-workbench-20261102
      - feature/private-insurance-review-20261102
      - feature/carrier-geography-atlas-20261102
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Python test dependencies
        run: python -m pip install -r scripts/requirements-nationwide.txt
      - name: Run Python unit and API tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify local browser application syntax
        run: node --check local_workspace/app.js
      - name: Install web application dependencies
        run: npm ci --no-audit --no-fund
      - name: Run JavaScript tests
        run: npm test
      - name: Typecheck production frontend
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
