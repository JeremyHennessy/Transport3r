name: Apply verified optional-package URL correction

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verified-lock-correction.yml']

permissions:
  contents: write

concurrency:
  group: verified-lock-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  exact-correction:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/pinned-build-dependencies-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pinned-build-dependencies-20261109
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact reviewed input and change only the optional tarball URL
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          expected = os.environ['EXPECTED_HEAD']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == expected
          path = pathlib.Path('package-lock.json')
          before = subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          original = '19e99a0edfc8378c2ba551ca1298d1bb79c9a2ba'
          corrected = 'eecb9c9fd2b6d8e5e0cc48964cfc2c638d7f6c5b'
          assert before in (original, corrected), before
          raw = path.read_bytes()
          old = b'https://registry.npmjs.org/@rollup/rollup-openharmony-arm64/-/openharmony-arm64-4.68.2.tgz'
          new = b'https://registry.npmjs.org/@rollup/rollup-openharmony-arm64/-/rollup-openharmony-arm64-4.68.2.tgz'
          if before == original:
              assert raw.count(old) == 1
              changed = raw.replace(old,new)
              prior, after_value = json.loads(raw), json.loads(changed)
              prior['packages']['node_modules/@rollup/rollup-openharmony-arm64']['resolved'] = new.decode()
              assert prior == after_value, 'Unexpected semantic lockfile change'
              path.write_bytes(changed)
          after = subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          assert after == corrected, after
          pathlib.Path('/tmp/lock-correction.json').write_text(json.dumps({'input_head': expected, 'before_blob': before, 'after_blob': after, 'changed': before != after, 'deployed': False},indent=2))
          PY
          node --test scripts/dependency-security.test.mjs scripts/optional-package-urls.test.mjs
          git diff --check
      - name: Commit the verified correction only to this feature branch
        run: |
          test "$(git diff --name-only)" = 'package-lock.json' || test -z "$(git diff --name-only)"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- package-lock.json
            git commit -m 'Correct exact optional Rollup tarball URL without changing dependency versions'
            git push origin HEAD:refs/heads/security/pinned-build-dependencies-20261109
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-lock-correction-${{ github.run_id }}
          path: /tmp/lock-correction.json
          if-no-files-found: warn
          retention-days: 7
