name: Apply TRI v0.1 scoring

on:
  push:
    branches: [feature/tri-score-v01-20260908]
    paths:
      - 'scripts/apply_tri_score_v01.py'
      - '.github/workflows/apply-tri-score-v01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply score and fleet-integrity patch
        run: python scripts/apply_tri_score_v01.py
      - name: Audit live Company Census fleet bands
        run: python scripts/audit_fleet_consistency.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Validate Python entrypoints compile
        run: python -m py_compile scripts/audit_fleet_consistency.py scripts/refresh_fmcsa.py scripts/smoke_carrier_queries.py scripts/validate_sms_v321_replay.py
      - name: Smoke live Carrier 360 joins
        run: python scripts/smoke_carrier_queries.py
      - name: Validate SMS v3.21 replay
        run: python scripts/validate_sms_v321_replay.py
      - name: Commit verified app changes
        run: |
          rm -f scripts/apply_tri_score_v01.py
          git restore --source=HEAD -- .github/workflows
          git config user.name 'transport3r-score-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Build TRI v0.1 underwriting score'
          git push origin HEAD:feature/tri-score-v01-20260908
