name: Apply verified map source and browser check
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/prepare-maplibre.yml', 'maintenance/apply-reviewed-map-source.py']
permissions:
  contents: write
concurrency:
  group: apply-map-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/filtered-open-maps-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/filtered-open-maps-20261109
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply only the exact hash-verified reviewed source and worker fix
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python maintenance/apply-reviewed-map-source.py
          git diff --check
      - name: Validate source without mislabelling an uncommitted production build
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Commit verified source locally and build that exact candidate
        run: |
          python - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/transport3r-map-source/verified-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual)==set(paths),(actual,paths)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement filtered MapLibre maps, bundled worker, responsive table and bounded source retries'
          test -z "$(git status --porcelain)"
          candidate="$(git rev-parse HEAD)"
          printf '%s\n' "$candidate" > /tmp/transport3r-map-source/commit.txt
          GITHUB_SHA="$candidate" npm run build
      - name: Exercise committed map interactions and responsive table in Chromium
        run: |
          python -m pip install playwright==1.57.0
          python scripts/validate_open_maps_browser.py /tmp/transport3r-map-source/browser
      - name: Push only after the exact candidate build and browser checks pass
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/feature/filtered-open-maps-20261109 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/feature/filtered-open-maps-20261109
      - name: Retain actual source, bundle and checks without private data
        if: always()
        run: |
          mkdir -p /tmp/transport3r-map-source
          git archive --format=tar HEAD -o /tmp/transport3r-map-source/source.tar
          if [ -d dist ]; then cp -R dist /tmp/transport3r-map-source/dist; fi
          git status --short > /tmp/transport3r-map-source/worktree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-map-source-${{ github.run_id }}
          path: /tmp/transport3r-map-source
          if-no-files-found: error
          retention-days: 7
