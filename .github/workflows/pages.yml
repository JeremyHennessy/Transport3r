name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify hosted release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${PAGE_URL}" ]]; then
            echo "Pages deployment did not return a public URL" >&2
            exit 1
          fi

          echo "Verifying ${PAGE_URL} for ${EXPECTED_SHA}"
          curl --fail --location --silent --show-error \
            --retry 8 --retry-delay 2 --retry-all-errors \
            "${PAGE_URL}" -o /tmp/transport3r-index.html

          grep -q '<div id="root"></div>' /tmp/transport3r-index.html

          JS_PATH="$(grep -oE 'src="[^"]+\.js"' /tmp/transport3r-index.html | head -1 | sed -E 's/^src="//;s/"$//')"
          CSS_PATH="$(grep -oE 'href="[^"]+\.css"' /tmp/transport3r-index.html | head -1 | sed -E 's/^href="//;s/"$//')"
          if [[ -z "${JS_PATH}" || -z "${CSS_PATH}" ]]; then
            echo "Hosted index is missing compiled JS/CSS references" >&2
            cat /tmp/transport3r-index.html >&2
            exit 1
          fi

          ORIGIN="$(printf '%s' "${PAGE_URL}" | sed -E 's#^(https?://[^/]+).*$#\1#')"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "${ORIGIN}${JS_PATH}" -o /tmp/transport3r-app.js
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "${ORIGIN}${CSS_PATH}" -o /tmp/transport3r-app.css
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "${PAGE_URL%/}/data/source-health.json" -o /tmp/source-health.json
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "${PAGE_URL%/}/data/source-schemas.json" -o /tmp/source-schemas.json

          test -s /tmp/transport3r-app.js
          test -s /tmp/transport3r-app.css
          grep -q 'Know the carrier before you price the risk' /tmp/transport3r-app.js
          grep -q 'Runtime recovery' /tmp/transport3r-app.js

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/source-health.json').read_text())
          schemas = json.loads(Path('/tmp/source-schemas.json').read_text())
          assert len(health.get('sources', [])) == 27, health
          assert schemas.get('source_count') == 27, schemas.get('source_count')
          assert schemas.get('field_count', 0) > 0, schemas.get('field_count')
          print({
              'hosted_source_count': len(health.get('sources', [])),
              'hosted_schema_sources': schemas.get('source_count'),
              'hosted_schema_fields': schemas.get('field_count'),
          })
          PY

          echo "Hosted Pages release verified: ${PAGE_URL}"

      - name: Verify rendered live routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/transport3r-ui

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "${CHROME}" ]]; then
            echo "No Chrome/Chromium executable available on runner" >&2
            exit 1
          fi

          render_route() {
            local label="$1"
            local hash="$2"
            local expected="$3"
            local url="${PAGE_URL%/}/${hash}"
            local dom="/tmp/transport3r-ui/${label}.html"
            local png="/tmp/transport3r-ui/${label}.png"

            echo "Rendering ${label}: ${url}"
            timeout 45s "${CHROME}" \
              --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=18000 \
              --dump-dom "${url}" > "${dom}" 2> "/tmp/transport3r-ui/${label}.log"

            grep -Fq "${expected}" "${dom}"
            if grep -Fq 'Transport3r could not render this view.' "${dom}"; then
              echo "${label} hit the React runtime recovery boundary" >&2
              exit 1
            fi
            if grep -Fq 'Carrier identity could not load.' "${dom}"; then
              echo "${label} could not resolve carrier identity" >&2
              exit 1
            fi
            if grep -Fq 'This evidence tab could not load.' "${dom}"; then
              echo "${label} evidence load failed" >&2
              exit 1
            fi

            timeout 45s "${CHROME}" \
              --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=18000 \
              --screenshot="${png}" "${url}" >/dev/null 2>> "/tmp/transport3r-ui/${label}.log"
          }

          render_route overview '#/overview' 'Know the carrier before you price the risk.'
          render_route carriers '#/carriers' 'Nationwide carrier intelligence'
          render_route summary '#/carrier/3938496/summary' 'Underwriting evidence at a glance'
          render_route fleet '#/carrier/3938496/fleet' 'Fleet evidence'
          grep -Fq '3C63RRGLXNG286232' /tmp/transport3r-ui/fleet.html
          render_route insurance '#/carrier/3938496/insurance' 'Coverage continuity'
          render_route sms '#/carrier/3938496/sms' 'Official output and Transport replay'
          render_route sources '#/sources' 'All 27 configured FMCSA/DOT datasets'

          echo "Rendered route smoke passed for overview, carriers, carrier summary, fleet, insurance, SMS and data sources."

      - name: Upload live UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-smoke-${{ github.sha }}
          path: |
            /tmp/transport3r-ui/*.png
            /tmp/transport3r-ui/*.html
            /tmp/transport3r-ui/*.log
          if-no-files-found: warn
