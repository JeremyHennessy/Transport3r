name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test data integrity and snapshot gates
        run: |
          python -m pip install -r scripts/requirements-nationwide.txt
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Audit live fleet consistency
        run: python scripts/audit_fleet_consistency.py
      - name: Validate source registry alignment
        run: python scripts/validate_source_contract.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test release verification
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          VITE_EVIDENCE_API_URL: ${{ vars.EVIDENCE_API_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-hosted.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser validation client
        run: python -m pip install playwright==1.57.0
      - name: Verify desktop and mobile live routes in one browser state
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/verify_live_ui.py --output /tmp/transport3r-ui

      - name: Upload live UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-smoke-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/transport3r-ui/*.png
            /tmp/transport3r-ui/*.html
            /tmp/transport3r-ui/*.json
          if-no-files-found: warn
