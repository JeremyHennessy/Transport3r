name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh official FMCSA source contract
        run: python scripts/refresh_fmcsa.py --workers 6

      - name: Test data integrity and snapshot gates
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Audit live fleet consistency
        run: python scripts/audit_fleet_consistency.py
      - name: Validate source registry alignment
        run: python scripts/validate_source_contract.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test release verification
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify hosted release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-hosted.mjs

      - name: Verify rendered live routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/transport3r-ui

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "${CHROME}" ]]; then
            echo "No Chrome/Chromium executable available on runner" >&2
            exit 1
          fi

          render_route() {
            local label="$1"
            local hash="$2"
            local expected="$3"
            local url="${PAGE_URL%/}/${hash}"
            local dom="/tmp/transport3r-ui/${label}.html"
            local png="/tmp/transport3r-ui/${label}.png"

            echo "Rendering ${label}: ${url}"
            timeout 45s "${CHROME}" \
              --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=18000 \
              --dump-dom "${url}" > "${dom}" 2> "/tmp/transport3r-ui/${label}.log"

            grep -Fq "${expected}" "${dom}"
            if grep -Fq 'Transport3r could not render this view.' "${dom}"; then
              echo "${label} hit the React runtime recovery boundary" >&2
              exit 1
            fi
            if grep -Fq 'Carrier identity could not load.' "${dom}"; then
              echo "${label} could not resolve carrier identity" >&2
              exit 1
            fi
            if grep -Fq 'This evidence tab could not load.' "${dom}"; then
              echo "${label} evidence load failed" >&2
              exit 1
            fi

            timeout 45s "${CHROME}" \
              --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=18000 \
              --screenshot="${png}" "${url}" >/dev/null 2>> "/tmp/transport3r-ui/${label}.log"
          }

          render_route overview '#/overview' 'Know the carrier before you price the risk.'
          render_route carriers '#/carriers' 'Nationwide carrier intelligence'
          render_route summary '#/carrier/3938496/summary' 'Underwriting evidence at a glance'
          render_route safety '#/carrier/3938496/safety' 'Violation evidence'
          render_route authority '#/carrier/3938496/authority' 'Authority'
          render_route evidence '#/carrier/3938496/evidence' 'Evidence'
          render_route portfolio '#/portfolio' 'Portfolio'
          render_route alerts '#/alerts' 'Alerts'
          render_route methodology '#/methodology' 'Methodology'
          render_route fleet '#/carrier/3938496/fleet' 'Reported fleet exposure'
          grep -Fq '3C63RRGLXNG286232' /tmp/transport3r-ui/fleet.html
          render_route insurance '#/carrier/3938496/insurance' 'Coverage continuity'
          render_route sms '#/carrier/3938496/sms' 'Official output and Transport replay'
          render_route sources '#/sources' 'All 36 configured FMCSA/DOT datasets'
          render_route inspection '#/carrier/3938496/inspection/82574029' 'Retrieved directly by inspection ID'
          render_route vin '#/carrier/3938496/vin/3C63RRGLXPG628183?inspection=82574029' 'Observed vehicle evidence'
          grep -Fq '#/carrier/3938496/inspection/82574029' /tmp/transport3r-ui/vin.html

          echo "Rendered route smoke passed for overview, carriers, carrier summary, fleet, insurance, SMS and data sources."

      - name: Upload live UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-smoke-${{ github.sha }}
          path: |
            /tmp/transport3r-ui/*.png
            /tmp/transport3r-ui/*.html
            /tmp/transport3r-ui/*.log
          if-no-files-found: warn
