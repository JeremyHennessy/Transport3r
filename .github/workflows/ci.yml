name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official FMCSA source contract
        run: python scripts/refresh_fmcsa.py --workers 6
      - name: Test data integrity and snapshot gates
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify complete cohort acquisition and SQLite promotion
        run: python scripts/validate_evidence_warehouse.py --output /tmp/transport3r-warehouse --per-stratum 1
      - name: Retain warehouse acquisition and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-warehouse-${{ github.sha }}
          path: /tmp/transport3r-warehouse/
          if-no-files-found: warn
      - name: Audit live fleet consistency
        run: python scripts/audit_fleet_consistency.py
      - name: Validate source registry alignment
        run: python scripts/validate_source_contract.py
      - name: Validate live FMCSA joins and normalization
        run: python scripts/validate_fmcsa_data_contract.py
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify carrier table recovery in the production browser bundle
        run: node scripts/validate-carrier-recovery.mjs /tmp/transport3r-carrier-recovery.json
      - name: Retain carrier recovery browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-recovery-${{ github.sha }}
          path: /tmp/transport3r-carrier-recovery.json
          if-no-files-found: warn
      - name: Verify source review and exposure UI in the production browser bundle
        env:
          BROWSER_SCENARIO: data-ui
        run: node scripts/validate-carrier-recovery.mjs /tmp/transport3r-data-ui.json
      - name: Retain data UI browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-ui-${{ github.sha }}
          path: /tmp/transport3r-data-ui.json
          if-no-files-found: warn
      - name: Verify all carrier evidence mappings for inactive and active registrations
        run: node scripts/validate-carrier-mappings.mjs /tmp/transport3r-carrier-mappings.json
      - name: Verify coverage filters and export in the production browser bundle
        env:
          BROWSER_SCENARIO: coverage
        run: node scripts/validate-carrier-recovery.mjs /tmp/transport3r-coverage-browser.json
      - name: Verify inspection and VIN drilldowns in the production browser bundle
        env:
          BROWSER_SCENARIO: inspection
        run: node scripts/validate-carrier-recovery.mjs /tmp/transport3r-inspection-browser.json
      - name: Retain inspection drilldown browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspection-drilldowns-${{ github.sha }}
          path: /tmp/transport3r-inspection-browser.json
          if-no-files-found: warn
      - name: Verify date windows and VIN enrichment in the production browser bundle
        env:
          BROWSER_SCENARIO: date-enrichment
        run: node scripts/validate-carrier-recovery.mjs /tmp/transport3r-date-enrichment.json
      - name: Retain date window and enrichment browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: date-enrichment-${{ github.sha }}
          path: /tmp/transport3r-date-enrichment.json
          if-no-files-found: warn
      - name: Reconcile stratified Census and detailed safety source windows
        run: node scripts/reconcile-carrier-cohort.mjs /tmp/transport3r-reconciliation
      - name: Retain coverage and reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reconciliation-${{ github.sha }}
          path: |
            /tmp/transport3r-coverage-browser.json
            /tmp/transport3r-reconciliation/
          if-no-files-found: warn
      - name: Retain complete carrier mapping checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrier-mappings-${{ github.sha }}
          path: /tmp/transport3r-carrier-mappings.json
          if-no-files-found: warn
      - name: Verify large-carrier drivers and full inspection counts
        run: node scripts/validate-large-carriers.mjs /tmp/transport3r-large-carriers.json
      - name: Retain large-carrier count verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-carrier-counts-${{ github.sha }}
          path: /tmp/transport3r-large-carriers.json
          if-no-files-found: warn
      - name: Validate Python entrypoints compile
        run: python -m py_compile scripts/refresh_fmcsa.py scripts/download_fmcsa.py scripts/snapshot_store.py scripts/verify_snapshot.py scripts/cohort_snapshot.py scripts/build_asof_panel.py scripts/smoke_carrier_queries.py scripts/validate_sms_v321_replay.py scripts/validate_source_contract.py scripts/validate_fmcsa_data_contract.py
      - name: Smoke live FMCSA Carrier 360 query joins
        run: python scripts/smoke_carrier_queries.py
      - name: Validate SMS v3.21 measure replay against FMCSA
        run: python scripts/validate_sms_v321_replay.py --runtime-sample /tmp/transport3r-sms-runtime.json
      - name: Validate application TypeScript SMS replay against the same FMCSA inputs
        shell: bash
        run: node scripts/validate-sms-runtime.mjs /tmp/transport3r-sms-runtime.json | tee /tmp/transport3r-sms-runtime-result.json
      - name: Retain SMS runtime inputs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sms-runtime-${{ github.sha }}
          path: |
            /tmp/transport3r-sms-runtime.json
            /tmp/transport3r-sms-runtime.json.before.json
            /tmp/transport3r-sms-runtime-result.json
          if-no-files-found: warn
