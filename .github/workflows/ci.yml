name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official FMCSA source contract
        run: python scripts/refresh_fmcsa.py --workers 6
      - name: Validate source registry alignment
        run: python scripts/validate_source_contract.py
      - name: Validate live FMCSA joins and normalization
        run: python scripts/validate_fmcsa_data_contract.py
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Validate Python entrypoints compile
        run: python -m py_compile scripts/refresh_fmcsa.py scripts/download_fmcsa.py scripts/smoke_carrier_queries.py scripts/validate_sms_v321_replay.py scripts/validate_source_contract.py scripts/validate_fmcsa_data_contract.py
      - name: Smoke live FMCSA Carrier 360 query joins
        run: python scripts/smoke_carrier_queries.py
      - name: Validate SMS v3.21 measure replay against FMCSA
        run: python scripts/validate_sms_v321_replay.py
