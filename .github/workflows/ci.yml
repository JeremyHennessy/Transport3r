name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python entrypoints compile
        run: python -m py_compile scripts/refresh_fmcsa.py scripts/download_fmcsa.py scripts/smoke_carrier_queries.py scripts/validate_sms_v321_replay.py scripts/probe_sms_population_aggregation.py scripts/diagnose_sms_vehicle_percentile_exact.py
      - name: Smoke live FMCSA Carrier 360 query joins
        run: python scripts/smoke_carrier_queries.py
      - name: Validate SMS v3.21 measure replay against FMCSA
        run: python scripts/validate_sms_v321_replay.py
      - name: Prove SMS population streaming contract
        run: python scripts/probe_sms_population_aggregation.py
      - name: Reconstruct exact nationwide Vehicle Maintenance percentile population
        run: python scripts/diagnose_sms_vehicle_percentile_exact.py
