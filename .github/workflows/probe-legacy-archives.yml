name: Probe legacy FMCSA archive joins

on:
  push:
    branches: [fix/fleet-exposure-20260908]
    paths:
      - 'scripts/probe_legacy_archive_joins.py'
      - '.github/workflows/probe-legacy-archives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe archive schemas and carrier bridge
        run: python scripts/probe_legacy_archive_joins.py
