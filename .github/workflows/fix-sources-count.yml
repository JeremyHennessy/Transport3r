name: Fix dynamic Sources count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sources-count.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make Sources heading registry-driven
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/WorkspaceApp.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'copy="All 27 configured FMCSA/DOT datasets, why they exist in Transport3r, their update cadence, and the job each performs in underwriting or validation."'
          new = 'copy={`All ${schema?.source_count ?? sourceCatalog.length} configured FMCSA/DOT datasets, why they exist in Transport3r, their update cadence, and the job each performs in underwriting or validation.`}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale Sources heading, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified correction
        run: |
          git config user.name 'transport3r-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/WorkspaceApp.tsx
          git diff --cached --check
          git commit -m 'Fix Sources count copy'
          git pull --rebase origin main
          git push origin HEAD:main
